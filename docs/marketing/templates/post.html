<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Template de post — Brasil em Números</title>
<style>
  /* Template fixo dos posts. 1080x1350 (4:5).
     Modos:
       ?modo=grafico&img=<caminho>&fonte=<órgão>&data=<MM/AAAA>&n=1&total=5
       ?modo=texto&eyebrow=<pilar>&titulo=<...>&corpo=<...>&n=2&total=5
     O rodapé é obrigatório nos dois modos (fonte + último dado + URL). */
  :root { --fundo:#0e1117; --texto:#ffffff; --fraco:#9aa4b2; --destaque:#ffd000; --secundario:#00fddc; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#000; }
  .slide {
    position: relative; width:1080px; height:1350px; overflow:hidden;
    background:var(--fundo); color:var(--texto);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* ---- modo gráfico ---- */
  .slide.grafico img { display:block; width:1080px; height:1223px; object-fit:cover; object-position:top; }
  /* ---- modo texto ---- */
  .slide.texto { padding:96px 84px 127px; display:flex; flex-direction:column; justify-content:center; }
  .eyebrow {
    font-size:26px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--destaque); font-weight:700; margin-bottom:40px;
  }
  .titulo { font-size:76px; line-height:1.08; font-weight:800; letter-spacing:-.02em; margin:0 0 40px; }
  .corpo { font-size:46px; line-height:1.34; color:#d7dce3; margin:0; font-weight:450; }
  .corpo strong { color:var(--texto); }
  .corpo .num { color:var(--destaque); font-weight:800; }
  /* ---- rodapé ---- */
  .rodape {
    position:absolute; left:0; right:0; bottom:0; height:127px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 56px; border-top:1px solid #1e2530; background:var(--fundo);
    font-size:24px; color:var(--fraco);
  }
  .rodape .fonte { max-width:760px; }
  .rodape .credito { font-size:18px; color:#6b7280; margin-top:2px; }
  .rodape .url { color:var(--secundario); font-weight:600; white-space:nowrap; }
  .pagina { position:absolute; right:56px; top:56px; font-size:24px; color:var(--fraco); }
</style>
</head>
<body>
<div class="slide" id="slide"></div>

<script>
  const p = new URLSearchParams(location.search);
  const modo = p.get('modo') || 'texto';
  const n = p.get('n') || '';
  const total = p.get('total') || '';
  const fonte = p.get('fonte') || 'fonte não informada';
  const data = p.get('data') || 'data não informada';
  const slide = document.getElementById('slide');

  const rodape = `
    <div class="rodape">
      <div class="fonte">${fonte} · último dado: ${data}${p.get('credito') ? '<div class="credito">Lightweight Charts (Apache-2.0)</div>' : ''}</div>
      <div class="url">brasilemnumeros.ong.br</div>
    </div>`;
  const pagina = (n && total) ? `<div class="pagina">${n}/${total}</div>` : '';

  if (modo === 'grafico') {
    slide.className = 'slide grafico';
    slide.innerHTML = `<img src="${p.get('img') || ''}" alt="">${pagina}${rodape}`;
  } else {
    slide.className = 'slide texto';
    slide.innerHTML = `
      ${pagina}
      <div class="eyebrow">${p.get('eyebrow') || 'olha o dado'}</div>
      <h1 class="titulo">${p.get('titulo') || 'Título do slide'}</h1>
      <p class="corpo">${p.get('corpo') || 'Uma ideia por slide. Corpo em até 60 palavras.'}</p>
      ${rodape}`;
  }
</script>
</body>
</html>
