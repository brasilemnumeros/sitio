# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # NODE_ENV=development em todo passo npm: garante que as devDependencies
    # (vitest, vite) sejam instaladas — com NODE_ENV=production o npm as omite.
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 26 — alinhado ao `sitio/.nvmrc` e ao `engines` dos dois `package.json`. Estava em 24,
          # e o local desenvolvimento rodava em 26: as duas versões funcionavam, mas uma deriva
          # entre o que se testa e o que se publica é o tipo de coisa que só aparece em produção.
          # A 26 vira LTS em 2026-10-28; até lá é `Current`, e é a versão que a suíte inteira roda.
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # Falhar rápido: as contas que erram calado são testadas antes de gastar o build (§10.7)
      - name: Testes do app
        run: npm ci --prefix app && npm test --prefix app

      - name: Build do app (Vite, saída de nome fixo)
        run: npm ci --prefix app && npm run build --prefix app

      - name: CSS do site (Tailwind CLI, da raiz de sitio/)
        run: npm ci && npx -y @tailwindcss/cli -i ./assets/css/main.css -o ./assets/css/main.dist.css

      - name: Canário do Tailwind (§10.3)
        run: bash scripts/checar-canario.sh

      # O E2E precisa do repo `dados/` para servir as séries e os governos. Ele é um repo
      # SEPARADO, então o checkout padrão não o traz. O `path: dados` o põe na raiz do
      # workspace — que de `app/` é `../dados/` (é o valor que o `DADOS_DIR` recebe abaixo).
      - name: Checkout do repo de dados
        uses: actions/checkout@v4
        with:
          repository: brasilemnumeros/dados
          ref: ${{ github.ref_name }}
          path: dados

      - name: Instalar o navegador do Playwright
        run: npx --prefix app playwright install --with-deps chromium

      # O teste que faz o CI recusar o que só uma captura de tela pegava (§10.7, reaberta).
      # Roda DEPOIS do Tailwind e do canário: o E2E sobe o dev server, que precisa do CSS.
      - name: Testes de navegação (E2E)
        env:
          DADOS_DIR: ../dados/
        run: npx --prefix app playwright test --config app/playwright.config.js

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build (Jekyll)
        uses: actions/jekyll-build-pages@v1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
